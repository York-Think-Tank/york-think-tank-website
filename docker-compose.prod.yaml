# Production stack. Clone the repo on the server, copy .env.example to .env and
# fill in the "Production" section, then:
#   docker compose pull
#   docker compose up -d
# COMPOSE_FILE in .env points plain `docker compose` at this file.

# Volumes are named after the project, so the clone's folder name must not change it
name: ytt

services:
  nginx:
    container_name: nginx
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
    volumes:
      # The official image runs envsubst on *.template into /etc/nginx/conf.d
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - frontend
      - strapi
    networks:
      - web

  frontend:
    container_name: frontend
    image: ghcr.io/york-think-tank/ytt-frontend:latest
    restart: unless-stopped
    environment:
      STRAPI_URL: ${STRAPI_URL}
      # API fetches go straight over the Docker network, not out through Cloudflare
      STRAPI_INTERNAL_URL: http://strapi:1337
      STRAPI_READ_API_KEY: ${STRAPI_READ_API_KEY}
      # adapter-node uses this for request origin checks behind the proxy
      ORIGIN: https://${SITE_DOMAIN}
    networks:
      - web

  strapi:
    container_name: strapi
    image: ghcr.io/york-think-tank/ytt-strapi:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: strapiDB
      IS_PROXIED: "true"
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    networks:
      - web
      - strapi
    depends_on:
      strapiDB:
        condition: service_healthy

  strapiDB:
    container_name: strapiDB
    restart: unless-stopped
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql
    networks:
      - strapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly encrypted backups to Backblaze B2, see ops/backup/README.md
  backup:
    container_name: backup
    image: ghcr.io/york-think-tank/ytt-backup:latest
    restart: unless-stopped
    # restic tracks snapshots per host, so keep it stable across container recreates
    hostname: ytt-backup
    environment:
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_B2_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_B2_APPLICATION_KEY:-}
      HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
      CHECK_HEALTHCHECK_URL: ${BACKUP_CHECK_HEALTHCHECK_URL:-}
      PGHOST: strapiDB
      PGUSER: ${DATABASE_USERNAME}
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: ${DATABASE_NAME}
    volumes:
      - strapi-uploads:/data/uploads:ro
      # The directory rather than the file, so an editor replacing .env is still seen
      - .:/data/srv:ro
    networks:
      - strapi
    depends_on:
      strapiDB:
        condition: service_healthy

volumes:
  strapi-data:
  strapi-uploads:

networks:
  web:
  strapi:
